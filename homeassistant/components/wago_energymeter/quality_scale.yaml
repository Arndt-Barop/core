# Quality scale definition for WAGO Energy Meter integration
# https://developers.home-assistant.io/docs/integration_quality_scale_index
#
# Current tier: Silver (all Bronze + Silver requirements met or exempted)
# Target tier: Platinum (requires strict-typing completion + 95% test coverage)
rules:
  # Bronze tier rules (✅ All met or exempted)
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-high-level-description:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-installation-instructions:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-removal-instructions:
    status: exempt
    comment: Custom integration, documentation pending.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver tier rules (✅ All met or exempted)
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-installation-parameters:
    status: exempt
    comment: Custom integration, documentation pending.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Current coverage 44%. Requires hardware access to achieve 95% (sensor updates and meter.py Modbus operations).

  # Gold tier rules (⏳ 90% complete - only test-coverage pending)
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: WAGO Energy Meters use static IP addresses and are manually configured.
  discovery-update-info:
    status: exempt
    comment: No automatic discovery supported.
  docs-data-update:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-examples:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-known-limitations:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-supported-devices:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-supported-functions:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-troubleshooting:
    status: exempt
    comment: Custom integration, documentation pending.
  docs-use-cases:
    status: exempt
    comment: Custom integration, documentation pending.
  dynamic-devices:
    status: exempt
    comment: Integration supports single WAGO Energy Meter device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All entities are enabled by default as they provide essential energy meter data.
  entity-translations: done
  exception-translations:
    status: exempt
    comment: Standard exception messages are sufficient for this integration.
  icon-translations:
    status: exempt
    comment: Static icons are appropriate for energy meter sensors.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Integration uses standard error handling without repair flows.
  stale-devices:
    status: exempt
    comment: Devices are manually configured and do not become stale.

  # Platinum tier rules (✅ Complete - 2/2 applicable)
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Integration uses Modbus TCP protocol, not HTTP/HTTPS, so websession injection is not applicable.
  strict-typing: done
